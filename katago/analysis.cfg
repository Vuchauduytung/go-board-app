# KataGo analysis engine settings for a GTX 1650 (4 GB, no tensor cores)
logDir = /tmp/katago_logs
reportAnalysisWinratesAs = SIDETOMOVE
maxVisits = 400
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 16
nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
# FP16/NHWC kernels are ~7x slower on GPUs without tensor cores (benchmarked: 20 vs 145 visits/s)
cudaUseFP16 = false
cudaUseNHWC = false
